<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ritorno dalla Giungla</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101c17;color:#edf1d0;padding:14px;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto}header,footer{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font:36px Georgia;margin:8px 0}p{margin:8px 0}canvas{display:block;width:100%;aspect-ratio:16/9;background:#193123;border:1px solid #788666;border-radius:8px;margin:12px 0}button{font:inherit;color:#f2f5da;border:1px solid #768852;border-radius:6px;background:#293c2c;padding:8px 12px;cursor:pointer}button:focus-visible{outline:3px solid #f2c96a}#ideax-start{background:#bcca89;color:#142118;font-weight:bold}#ideax-status{color:#e5d59e}.pad{display:flex;gap:5px;flex-wrap:wrap}
</style><body><main><header><h1>Ritorno dalla Giungla</h1><button id="ideax-start" disabled>Avvia</button></header><p id="ideax-status" aria-live="polite">Pronto. Raggiungi la base e libera il compagno dopo aver superato i 100 avversari.</p><canvas id="world" width="768" height="432" aria-label="Giungla in prima persona"></canvas><footer><span>WASD o frecce · Spazio azione · E soccorso</span><div class="pad" aria-label="Comandi touch">
<button data-key="arrowleft">↶</button><button data-key="w">↑</button><button data-key="s">↓</button><button data-key="arrowright">↷</button><button data-key=" ">Azione</button><button data-key="e">Soccorri</button>
</div></footer></main><script>
'use strict';
const root=document.getElementById('world'), ctx=root.getContext('2d'), W=root.width,H=root.height;
const status=document.getElementById('ideax-status'), start=document.getElementById('ideax-start');
const N=17, goal={x:14.5,y:2.5};
const map=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>{
 if(y===0||x===0||x===N-1||y===N-1)return 1;
 if(y<=3||x===14||x===2)return 0;
 return ((x*11+y*7+x*y)%13 < 3)?1:0;
}));
const missione=__MISSIONE_TABELLA__;
function transizione(evento,vicino=false){return missione[count][vicino?1:0][evento];}
let x=2.5,y=2.5,a=0,count=0,active=false,won=false,flash=0,enemy={x:5,y:2.5};
const fov=Math.PI/3;
function wall(x,y){return map[Math.floor(y)]?.[Math.floor(x)] ?? 1;}
function ray(dir, limit=21){
 const dx=Math.cos(dir),dy=Math.sin(dir);
 for(let d=.035;d<limit;d+=.035) if(wall(x+dx*d,y+dy*d))return d;
 return limit;
}
function angle(d){return Math.atan2(Math.sin(d),Math.cos(d));}
function chooseEnemy(){
 const turns=[0,.6,-.6,1,-1,.32,-.32,1.5,-1.5,Math.PI];
 for(let i=0;i<turns.length;i++){
  const turn=turns[(i+(count%4===0?0:count%3))%turns.length],dir=a+turn;
  const d=Math.min(3.9,ray(dir)-.24);
  if(d>1.2){enemy={x:x+Math.cos(dir)*d,y:y+Math.sin(dir)*d};return;}
 }
 enemy={x:5,y:2.5};
}
function update(msg){
 status.textContent=(msg||'Missione in corso')+' · '+count+'/100 · Base a '+Math.round(Math.hypot(goal.x-x,goal.y-y))+' m';
}
function go(dx,dy){
 if(!wall(x+dx,y))x+=dx;
 if(!wall(x,y+dy))y+=dy;
}
function key(k){
 if(!active||won)return;
 if(k==='arrowleft')a-=.14;
 else if(k==='arrowright')a+=.14;
 else if(k==='w'||k==='arrowup')go(Math.cos(a)*.26,Math.sin(a)*.26);
 else if(k==='s'||k==='arrowdown')go(-Math.cos(a)*.26,-Math.sin(a)*.26);
 else if(k==='a')go(Math.sin(a)*.24,-Math.cos(a)*.24);
 else if(k==='d')go(-Math.sin(a)*.24,Math.cos(a)*.24);
 else if(k===' '&&count<100){
  flash=performance.now()+100;
  const dx=enemy.x-x,dy=enemy.y-y,dir=Math.atan2(dy,dx),d=Math.hypot(dx,dy);
  if(Math.abs(angle(dir-a))<.16&&d<ray(dir)+.05){count=transizione("azione").passati;chooseEnemy();update(count===100?'Tutti gli avversari superati. Cerca la base.':'Avversario superato');}
  else update('Bersaglio fuori mira');
  return;
 } else if(k==='e'){
  const vicino=Math.hypot(goal.x-x,goal.y-y)<=1.3;
  if(transizione('soccorso',vicino).vittoria){won=true;status.textContent='Missione completata. Compagno liberato.';}
  else update(vicino?'Completa il percorso prima del soccorso':'Avvicinati al segnale della base');
  return;
 }
 update();
}
function render(t){
 const sky=ctx.createLinearGradient(0,0,0,H/2);sky.addColorStop(0,'#31483b');sky.addColorStop(1,'#9aaa72');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H/2);
 const ground=ctx.createLinearGradient(0,H/2,0,H);ground.addColorStop(0,'#53643a');ground.addColorStop(1,'#263421');
 ctx.fillStyle=ground;ctx.fillRect(0,H/2,W,H/2);
 const depth=[];
 for(let col=0;col<W;col+=3){
  const dir=a+(col/W-.5)*fov,d=ray(dir)*Math.cos(dir-a),h=Math.min(H*2,H/(d+.04)*.82);
  depth[col/3]=d;const shade=Math.max(.18,1-d/17), noise=Math.sin(col*1.7)*7;
  ctx.fillStyle='rgb('+Math.floor((54+noise)*shade)+','+Math.floor((84+noise)*shade)+','+Math.floor(38*shade)+')';
  ctx.fillRect(col,H/2-h/2,3,h);
 }
 function marker(p,color,label){
  const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy),rel=angle(Math.atan2(dy,dx)-a);
  if(Math.abs(rel)>fov/2||d<.15)return;
  const col=W*(rel/fov+.5);
  if(d*Math.cos(rel)>depth[Math.floor(col/3)]+.1)return;
  const h=Math.min(H*.68,220/d), yy=H/2+h*.34;
  ctx.fillStyle=color;ctx.fillRect(col-h*.13,yy-h*.56,h*.26,h*.49);
  ctx.beginPath();ctx.arc(col,yy-h*.67,h*.105,0,Math.PI*2);ctx.fill();
  if(label){ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(label,col,yy-h*.88);}
 }
 if(count<100)marker(enemy,'#d8a671','');
 marker(goal,'#b5eccc','BASE');
 ctx.strokeStyle=t<flash?'#ffe19b':'#f9e8bba8';ctx.beginPath();ctx.moveTo(W/2-9,H/2);ctx.lineTo(W/2+9,H/2);ctx.moveTo(W/2,H/2-9);ctx.lineTo(W/2,H/2+9);ctx.stroke();
 ctx.fillStyle='#24302c';ctx.fillRect(W/2-19,H-67,38,67);ctx.fillStyle='#627068';ctx.fillRect(W/2-8,H-74,16,30);
 requestAnimationFrame(render);
}
start.onclick=()=>{x=2.5;y=2.5;a=0;count=transizione("riavvio").passati;active=true;won=false;enemy={x:5,y:2.5};start.textContent='Ricomincia';update();};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','e'].includes(k)){e.preventDefault();key(k);}});
document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>key(button.dataset.key));
root.onclick=()=>key(' ');
start.disabled=false;
requestAnimationFrame(render);
</script></body></html>
